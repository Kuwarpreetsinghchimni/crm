{% extends "base.html" %}

{% block title %}{{ action }} Contact - Sidak CRM{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">{{ action }} Contact</h1>
        <p class="page-subtitle">Fill in the contact information below.</p>
    </div>
    <a href="{{ url_for('contacts_list') }}" class="btn btn-secondary">&larr; Back to Contacts</a>
</div>

<div class="card">
    <div class="card-body">
        <form 
            method="POST" 
            action="{% if action == 'Edit' %}{{ url_for('contact_edit', contact_id=contact_id) }}{% else %}{{ url_for('contact_create') }}{% endif %}"
            data-validate="true"
        >
            <div class="form-grid">
                <!-- Full Name -->
                <div class="form-group">
                    <label class="form-label" for="full_name">
                        Full Name <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="full_name" 
                        name="full_name" 
                        class="form-control" 
                        value="{{ form_data.full_name or '' }}" 
                        required 
                        placeholder="e.g. John Doe"
                    >
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label class="form-label" for="email">
                        Email Address <span class="required">*</span>
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        value="{{ form_data.email or '' }}" 
                        required 
                        placeholder="e.g. john@example.com"
                    >
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input 
                        type="text" 
                        id="phone" 
                        name="phone" 
                        class="form-control" 
                        value="{{ form_data.phone or '' }}" 
                        placeholder="e.g. +1 555-0199"
                    >
                </div>

                <!-- Company -->
                <div class="form-group">
                    <label class="form-label" for="company">Company</label>
                    <input 
                        type="text" 
                        id="company" 
                        name="company" 
                        class="form-control" 
                        value="{{ form_data.company or '' }}" 
                        placeholder="e.g. Acme Corporation"
                    >
                </div>

                <!-- Job Title -->
                <div class="form-group-full form-group">
                    <label class="form-label" for="job_title">Job Title</label>
                    <input 
                        type="text" 
                        id="job_title" 
                        name="job_title" 
                        class="form-control" 
                        value="{{ form_data.job_title or '' }}" 
                        placeholder="e.g. Senior Account Executive"
                    >
                </div>

                <!-- Address -->
                <div class="form-group-full form-group">
                    <label class="form-label" for="address">Mailing Address</label>
                    <textarea 
                        id="address" 
                        name="address" 
                        class="form-control" 
                        placeholder="Street, City, State, ZIP..."
                    >{{ form_data.address or '' }}</textarea>
                </div>

                <!-- Notes -->
                <div class="form-group-full form-group">
                    <label class="form-label" for="notes">Internal Notes</label>
                    <textarea 
                        id="notes" 
                        name="notes" 
                        class="form-control" 
                        placeholder="Additional details, preferences, context..."
                    >{{ form_data.notes or '' }}</textarea>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <a href="{{ url_for('contacts_list') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    {% if action == 'Edit' %}Save Changes{% else %}Create Contact{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
